services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dosh
      POSTGRES_PASSWORD: dosh
      POSTGRES_DB: dosh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosh -d dosh"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
