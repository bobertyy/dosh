[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dosh-domain = { path = "../../crates/dosh-domain" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.24.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
testcontainers = "0.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
